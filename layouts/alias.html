{{- /* Hugo's embedded alias template (tpl/tplimpl/embedded/templates/alias.html
in Hugo 0.166), with the noindex meta tag that baseof.html also writes. */ -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
	<head>
		<title>{{ .Permalink }}</title>
		{{ with .OutputFormats.Canonical }}<link rel="{{ .Rel }}" href="{{ .Permalink }}">{{ end }}
		<meta charset="utf-8">
		{{- if site.Params.noindex }}
		<meta name="robots" content="noindex, nofollow">
		{{- end }}
		<meta http-equiv="refresh" content="0; url={{ .Permalink }}">
	</head>
</html>
