name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per ref. A new run for a pull request cancels the
# older one. A new run for main waits instead, so that a push does not
# cancel a Pages deployment that is in progress. GitHub keeps only the
# newest waiting run in a group and cancels older waiting runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.166.0
  # "staging" builds for static.stimhack.com and asks search engines not to
  # index it (config/staging/). Set the repository variable SITE_ENV to
  # "production" when stimhack.com moves to this site.
  SITE_ENV: ${{ vars.SITE_ENV || 'staging' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Unit tests
        run: python3 -m unittest discover tests

      # Do not add --minify: it would mangle the XML feed at /feed/.
      - name: Build
        run: hugo --gc --printPathWarnings --panicOnWarning --environment "$SITE_ENV"

      - name: Check old URLs and internal links
        run: python3 scripts/check_site.py

      - name: Check site size
        run: |
          size=$(du -sm public | cut -f1)
          echo "Site size: ${size} MB (GitHub Pages limit: 1024 MB)"
          test "$size" -lt 950

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
