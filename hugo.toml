baseURL = "https://stimhack.com/"
title = "StimHack"
locale = "en-US"
timeZone = "America/Los_Angeles"
enableRobotsTXT = true
# WordPress URLs have no /index.html and keep their trailing slash.
uglyURLs = false

[params]
  description = "A Community for Netrunner Players"
  contact = "Contact us at stimhack(at)gmail(dot)com."
  headerImage = "/wp-content/uploads/2014/03/graffiti_banner_logo_center2.png"
  favicon = "/wp-content/uploads/2013/11/favicon.ico"
  # Category whose newest posts fill the home page grid.
  homeCategory = "articles"
  homePosts = 12
  # Categories whose posts the site feed leaves out, as the WordPress feed did.
  feedExcludeCategories = ["decklists"]
  repo = "https://github.com/stimhack-com/stimhack.com"

  [[params.socials]]
    name = "Twitch"
    url = "http://www.twitch.tv/stimhacked"
  [[params.socials]]
    name = "Twitter"
    url = "https://twitter.com/stimhacked"
  [[params.socials]]
    name = "YouTube"
    url = "https://www.youtube.com/user/stimhack"
  [[params.socials]]
    name = "RSS"
    url = "/feed/"

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

# Keep every WordPress permalink.
[permalinks.page]
  posts = "/:slugorcontentbasename/"
[permalinks.term]
  categories = "/category/:slug/"
  tags = "/tag/:slug/"
  authors = "/author/:slug/"
[permalinks.taxonomy]
  categories = "/category/"
  tags = "/tag/"
  authors = "/author/"

[pagination]
  pagerSize = 10
  path = "page"

[markup.goldmark.renderer]
  # Markdown posts can embed HTML (iframes, decklist tables).
  unsafe = true

# A new post refers to the images and files in its folder by file name.
# Archive pages show the whole content of a video post, so a relative URL
# there resolves against the archive URL. Hugo's embedded render hooks
# replace a file name that is a resource of the page with its URL from the
# site root. The link hook does the same for a path to a page, and puts the
# page URL in front of a #fragment. Other URLs stay as written. "fallback"
# uses the embedded hook only when layouts/_markup/ has no hook of that kind.
[markup.goldmark.renderHooks.image]
  useEmbedded = "fallback"
[markup.goldmark.renderHooks.link]
  useEmbedded = "fallback"

# WordPress served the feed at /feed/, and the feed of each category at
# /category/<slug>/feed/. GitHub Pages only serves index.html for a
# directory, so each feed is written to feed/index.html as well.
# Do not build with --minify: the HTML minifier would mangle this XML.
[outputFormats.wpfeed]
  mediaType = "text/html"
  baseName = "feed/index"
  isPlainText = true
  notAlternative = true

# WordPress IDs of posts and pages and their URLs, for old /?p=<ID> links.
[outputFormats.wpids]
  mediaType = "application/json"
  baseName = "wp-ids"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "wpfeed", "wpids"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

# Category archives have feeds too. Tag and author archives do not.
[[cascade]]
  outputs = ["html", "rss", "wpfeed"]
  [cascade.target]
    kind = "term"
    path = "{/categories/**}"

[services.rss]
  limit = 20

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10
  pre = "fa-home"
[[menus.main]]
