  pre = "fa-list-alt"
[[menus.main]]
  parent = "articles"
  name = "Classic Articles"
  pageRef = "/pages/classic-articles"
  weight = 1
  pre = "fa-book"
[[menus.main]]
  parent = "articles"
  name = "Set Reviews"
  pageRef = "/pages/set-reviews"
